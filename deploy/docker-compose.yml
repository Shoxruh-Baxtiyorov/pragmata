name: soqchi

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: soqchi
      POSTGRES_PASSWORD: soqchi
      POSTGRES_DB: soqchi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soqchi -d soqchi"]
      interval: 2s
      timeout: 3s
      retries: 30

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "127.0.0.1:8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  # не нужны в неделе 1 — поднимаются профилем: docker compose --profile full up -d
  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "127.0.0.1:6380:6379"

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soqchi
      MINIO_ROOT_PASSWORD: soqchi-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
