# Ночной пресет: conf ниже (тёмные силуэты дают слабую уверенность) +
# imgsz выше (мелкие детали в темноте). Сравнить с night в dev-degraded.yaml.
site:
  name: "Night Tuned"
  timezone: "Asia/Tashkent"

rules:
  min_track_seconds: 0.7
  track_lost_ttl: 2.0

cameras:
  - id: night_tuned
    name: "Ночь (пресет)"
    url: "data/samples/degraded/night.mp4"
    process_fps: 4
    detect_conf: 0.2
    detect_imgsz: 960
    motion: { enabled: false, min_area_pct: 0.4, cooldown_s: 3.0 }
    zones:
      - name: restricted-right
        polygon: [[0.55, 0.05], [0.98, 0.05], [0.98, 0.97], [0.55, 0.97]]
        rules:
          zone_intrusion: { hysteresis_frames: 6, cooldown_s: 60 }
