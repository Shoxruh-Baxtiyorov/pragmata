# Dev-стенд: одна «камера» = зацикленный сэмпл через MediaMTX (scripts/publish_sample.sh)
site:
  name: "Dev Stand"
  timezone: "Asia/Tashkent"

rules:
  min_track_seconds: 0.7   # трек короче — шум, событий не рождает
  track_lost_ttl: 2.0      # сек без детекций → трек завершён

cameras:
  - id: cam1
    name: "Sample cam 1"
    url: "rtsp://127.0.0.1:8554/cam1"
    process_fps: 4
    detect_conf: 0.35
    motion:
      enabled: true
      min_area_pct: 0.4    # % изменившихся пикселей, чтобы проснуться
      cooldown_s: 3.0      # сколько держать «глаза открытыми» после движения
    zones:
      - name: restricted-right
        type: restricted
        # нормализованные координаты [x, y] (0..1), «пол» человека = низ bbox
        polygon: [[0.55, 0.05], [0.98, 0.05], [0.98, 0.97], [0.55, 0.97]]
        rules:
          zone_intrusion: { hysteresis_frames: 6, cooldown_s: 60 }
          loitering: { dwell_s: 12, cooldown_s: 120 }
