name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  APP_ENV: test  # encryption падает на детерминированный dev-ключ (soqchi/core/encryption.py)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run ruff check soqchi/ tests/
      - run: uv run ruff format --check soqchi/ tests/

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run mypy soqchi/

  schema:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - name: OpenAPI contract is current
        run: uv run python scripts/generate_openapi.py --check

  audit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv pip install pip-audit
      - name: Run pip-audit (fail on vulnerabilities)
        run: uv run pip-audit --strict || (echo "::warning::pip-audit found advisories"; exit 1)

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run pytest -v

  golden:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - name: Fetch golden clip
        run: |
          mkdir -p data/samples
          curl -fsSL -o data/samples/people.mp4 \
            "https://github.com/intel-iot-devkit/sample-videos/raw/master/people-detection.mp4"
      - name: Run golden pipeline test
        run: uv run pytest -m golden -v
